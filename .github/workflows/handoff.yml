name: handoff

# On-demand changelist vs the product source-of-truth repos (logos-webui,
# logos-infra): what the adopted designs change, as a markdown summary and
# ready-to-apply .patch artifacts for the frontend dev.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changelist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The product repos are private — cloning them needs UPSTREAM_REPOS_TOKEN,
      # a fine-grained PAT with Contents:read on angosr/logos-webui and
      # angosr/logos-infra (repo Settings → Secrets and variables → Actions).
      - name: Authenticate upstream clones
        env:
          UPSTREAM_REPOS_TOKEN: ${{ secrets.UPSTREAM_REPOS_TOKEN }}
        run: |
          if [ -z "$UPSTREAM_REPOS_TOKEN" ]; then
            echo "::error::UPSTREAM_REPOS_TOKEN secret is not set — needed to read the private product repos (angosr/logos-webui, angosr/logos-infra)."
            exit 1
          fi
          git config --global url."https://x-access-token:${UPSTREAM_REPOS_TOKEN}@github.com/angosr/".insteadOf "https://github.com/angosr/"

      - name: Sync against current upstream main
        run: npm run sync

      - name: Generate handoff changelist
        run: |
          node scripts/handoff-report.mjs --patch-dir handoff-patches | tee handoff-report.md
          cat handoff-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload changelist + patches
        uses: actions/upload-artifact@v4
        with:
          name: handoff-${{ github.run_number }}
          path: |
            handoff-report.md
            handoff-patches/
          if-no-files-found: warn
