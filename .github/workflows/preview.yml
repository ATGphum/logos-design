name: preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  build-deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build site
        run: |
          npm run build
          cd marketing && python3 build-preview.py
          cp preview.html ../dist/marketing.html

      - name: Build self-contained single-file preview
        run: |
          npm run build:single -- --outDir dist-single
          mkdir -p out
          cp dist-single/index.html out/logos-design-preview.html
          cp marketing/preview.html out/marketing-preview.html

      - name: Upload downloadable previews
        uses: actions/upload-artifact@v4
        with:
          name: previews
          path: out/
          retention-days: 30

      - name: Deploy to Pages (main → root)
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          keep_files: true # don't wipe pr-<n>/ previews

      - name: Deploy to Pages (PR → pr-<n>/)
        if: github.event_name == 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          destination_dir: pr-${{ github.event.pull_request.number }}

      - name: PR comment with preview links
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const n = context.issue.number
            const base = 'https://atgphum.github.io/logos-design'
            const marker = '<!-- preview-build -->'
            const body = [
              marker,
              '### 🖼 Live preview',
              '',
              `- **This PR:** ${base}/pr-${n}/ (designs at [#/login](${base}/pr-${n}/#/login), [#/console](${base}/pr-${n}/#/console) · [marketing](${base}/pr-${n}/marketing.html))`,
              `- **main:** ${base}/`,
              '',
              `Self-contained downloads (for offline/email sharing) are in this run's artifacts: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}#artifacts`,
              '',
              '_Preview URLs go live a minute or two after this comment (Pages deploy lag)._',
            ].join('\n')
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: n, per_page: 100,
            })
            const prev = comments.find(c => c.body?.startsWith(marker))
            if (prev) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: prev.id, body })
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: n, body })
            }

  cleanup-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Remove this PR's preview dir
        run: |
          DIR="pr-${{ github.event.pull_request.number }}"
          if [ -d "$DIR" ]; then
            git config user.name github-actions
            git config user.email github-actions@github.com
            git rm -rq "$DIR"
            git commit -m "Remove preview for closed PR #${{ github.event.pull_request.number }}"
            git push
          else
            echo "no preview dir to clean"
          fi
