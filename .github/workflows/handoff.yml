name: handoff

# On-demand changelist vs the product source-of-truth repos (logos-webui,
# logos-infra): what the adopted designs change, as a markdown summary and
# ready-to-apply .patch artifacts for the frontend dev.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changelist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The product repos are private. If the UPSTREAM_REPOS_TOKEN secret is
      # set (fine-grained PAT, Contents:read on angosr/logos-webui +
      # angosr/logos-infra), clones authenticate with it; otherwise fall back
      # to whatever credentials the environment already has — same behavior
      # as running the scripts locally, where the machine's git credential
      # helper signs the clones.
      - name: Authenticate upstream clones
        env:
          UPSTREAM_REPOS_TOKEN: ${{ secrets.UPSTREAM_REPOS_TOKEN }}
        run: |
          if [ -n "$UPSTREAM_REPOS_TOKEN" ]; then
            git config --global url."https://x-access-token:${UPSTREAM_REPOS_TOKEN}@github.com/angosr/".insteadOf "https://github.com/angosr/"
          else
            echo "::warning::UPSTREAM_REPOS_TOKEN is not set — falling back to ambient credentials. On GitHub-hosted runners the private product repos will not clone; run 'npm run handoff' locally instead, or add the secret."
          fi

      - name: Sync against current upstream main
        run: npm run sync

      - name: Generate handoff changelist
        run: |
          node scripts/handoff-report.mjs --patch-dir handoff-patches | tee handoff-report.md
          cat handoff-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload changelist + patches
        uses: actions/upload-artifact@v4
        with:
          name: handoff-${{ github.run_number }}
          path: |
            handoff-report.md
            handoff-patches/
          if-no-files-found: warn
